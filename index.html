<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>⚔️ Reinos de Ceniza</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            touch-action: none;
            user-select: none;
        }

        #game {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #111;
        }

        #world {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #18251b;
        }

        /* HUD */

        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 20;
            width: 210px;
            pointer-events: none;
        }

        #playerName {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 2px 2px 3px #000;
        }

        .bar {
            width: 100%;
            height: 16px;
            margin-bottom: 4px;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
            background: #333;
            box-shadow: 0 2px 5px #000;
        }

        .barInner {
            height: 100%;
            width: 100%;
            transition: width .15s;
        }

        #hpBar {
            background: #c62828;
        }

        #xpBar {
            background: #1976d2;
        }

        #hudText {
            color: white;
            font-size: 12px;
            text-shadow: 2px 2px 3px #000;
        }

        #message {
            position: fixed;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            color: white;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
            opacity: 0;
            transition: opacity .2s;
        }

        /* BOTÓN ATAQUE */

        #attackButton {
            position: fixed;
            right: 28px;
            bottom: 45px;
            z-index: 50;

            width: 78px;
            height: 78px;

            border-radius: 50%;
            border: 4px solid #777;

            background: radial-gradient(circle, #ff7043, #9b1c1c);

            color: white;
            font-size: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 5px 15px rgba(0,0,0,.7),
                inset 0 0 12px rgba(255,255,255,.25);
        }

        #attackButton:active {
            transform: scale(.90);
        }

        /* JOYSTICK */

        #joystick {
            position: fixed;
            left: 25px;
            bottom: 30px;

            width: 150px;
            height: 150px;

            z-index: 50;

            border-radius: 50%;

            background: rgba(255,255,255,.08);
            border: 2px solid rgba(255,255,255,.18);

            box-shadow:
                inset 0 0 20px rgba(0,0,0,.35),
                0 4px 15px rgba(0,0,0,.4);

            touch-action: none;
        }

        #joystickKnob {
            position: absolute;

            width: 68px;
            height: 68px;

            left: 41px;
            top: 41px;

            border-radius: 50%;

            background: rgba(255,255,255,.25);
            border: 3px solid rgba(255,255,255,.5);

            box-shadow:
                0 4px 10px rgba(0,0,0,.5),
                inset 0 0 12px rgba(255,255,255,.15);

            pointer-events: none;
        }

        /* INVENTARIO */

        #inventory {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 30;

            min-width: 125px;

            padding: 8px 10px;

            color: white;
            background: rgba(0,0,0,.55);

            border: 1px solid rgba(255,255,255,.2);
            border-radius: 8px;

            font-size: 12px;

            pointer-events: none;

            text-shadow: 1px 1px 2px #000;
        }

        @media (min-width: 800px) {
            #joystick {
                left: 40px;
                bottom: 35px;
            }

            #attackButton {
                right: 45px;
                bottom: 50px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <canvas id="world"></canvas>

</div>

<!-- HUD -->

<div id="hud">

    <div id="playerName">
        ⚔️ Aventurero
    </div>

    <div class="bar">
        <div
            id="hpBar"
            class="barInner"
        ></div>
    </div>

    <div class="bar">
        <div
            id="xpBar"
            class="barInner"
        ></div>
    </div>

    <div id="hudText">
        Nivel 1
    </div>

</div>

<div id="inventory">
    💰 Oro: <span id="gold">0</span><br>
    🎒 Madera: <span id="wood">0</span><br>
    ⛏️ Piedra: <span id="stone">0</span><br>
    🔩 Cobre: <span id="copper">0</span><br>
    ⚙️ Hierro: <span id="iron">0</span><br>
    🎣 Peces: <span id="fish">0</span>
</div>

<div id="message"></div>

<!-- JOYSTICK -->

<div id="joystick">
    <div id="joystickKnob"></div>
</div>

<!-- ATAQUE -->

<div id="attackButton">
    ⚔️
</div>

<script src="game.js?v=32"></script>

</body>
</html>
