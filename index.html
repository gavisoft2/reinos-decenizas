<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>⚔️ Reinos de Ceniza</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#10131a;
font-family:Arial,Helvetica,sans-serif;
color:white;
touch-action:none;
}

#world{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
display:block;
background:#172018;
}

/* ================= HUD ================= */

#hud{
position:fixed;
top:8px;
left:8px;
right:8px;
z-index:20;
pointer-events:none;
}

#topPanel{
display:flex;
align-items:center;
gap:8px;
max-width:650px;
}

#portrait{
width:48px;
height:48px;
border-radius:50%;
border:2px solid #d8a84e;
background:
radial-gradient(circle at 50% 30%,#f2c79a 0 20%,transparent 21%),
linear-gradient(#26394f 0 55%,#141820 56%);
box-shadow:0 2px 8px #000;
}

#bars{
flex:1;
max-width:430px;
}

.bar{
height:13px;
background:#1b1d22;
border:1px solid #000;
border-radius:8px;
overflow:hidden;
margin-bottom:3px;
box-shadow:inset 0 1px 2px #000;
}

.bar div{
height:100%;
width:100%;
transition:.2s;
}

#hpBar{
background:linear-gradient(90deg,#7b1111,#ef3333);
}

#manaBar{
background:linear-gradient(90deg,#113e91,#3f9dff);
}

#xpBar{
background:linear-gradient(90deg,#73500c,#e5b633);
}

.barText{
position:absolute;
font-size:8px;
margin-top:-12px;
width:100%;
text-align:center;
text-shadow:1px 1px #000;
}

#level{
font-weight:bold;
color:#ffd86b;
font-size:17px;
}

/* ================= RECURSOS ================= */

#resources{
position:fixed;
top:64px;
left:8px;
z-index:20;
display:flex;
gap:5px;
flex-wrap:wrap;
max-width:350px;
pointer-events:none;
}

.resource{
background:rgba(15,17,21,.82);
border:1px solid #765b2b;
border-radius:8px;
padding:4px 7px;
font-size:12px;
box-shadow:0 2px 5px #000;
}

/* ================= MINIMAPA ================= */

#miniWrap{
position:fixed;
top:8px;
right:8px;
z-index:25;
width:118px;
height:118px;
border-radius:50%;
overflow:hidden;
border:3px solid #b99145;
box-shadow:0 2px 10px #000;
background:#18251b;
}

#miniCanvas{
width:100%;
height:100%;
display:block;
}

/* ================= BOTONES LATERALES ================= */

#sideButtons{
position:fixed;
right:8px;
top:135px;
z-index:30;
display:flex;
flex-direction:column;
gap:7px;
}

.uiButton{
width:47px;
height:47px;
border-radius:12px;
border:2px solid #87652d;
background:linear-gradient(#343943,#17191e);
color:white;
font-size:21px;
box-shadow:0 3px 7px #000;
}

.uiButton:active{
transform:scale(.92);
}

/* ================= MISION ================= */

#questBox{
position:fixed;
left:8px;
top:108px;
z-index:20;
width:215px;
background:rgba(16,18,23,.85);
border:1px solid #87652d;
border-radius:8px;
padding:7px;
font-size:11px;
pointer-events:none;
}

#questTitle{
color:#ffd76a;
font-weight:bold;
margin-bottom:4px;
}

/* ================= JOYSTICK ================= */

#joystick{
position:fixed;
left:22px;
bottom:25px;
z-index:40;
width:145px;
height:145px;
border-radius:50%;
background:rgba(30,35,42,.65);
border:3px solid rgba(215,174,91,.7);
box-shadow:inset 0 0 20px #000,0 4px 10px #000;
}

#joystickKnob{
position:absolute;
width:68px;
height:68px;
left:50%;
top:50%;
margin-left:-34px;
margin-top:-34px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,#687281,#252b34);
border:2px solid #b99b61;
box-shadow:0 3px 8px #000;
}

/* ================= ATAQUE ================= */

#attackButton{
position:fixed;
right:24px;
bottom:28px;
z-index:40;
width:94px;
height:94px;
border-radius:50%;
border:4px solid #c89a43;
background:radial-gradient(circle,#7e2424,#351116);
color:white;
font-size:38px;
box-shadow:0 4px 12px #000;
}

#attackButton:active{
transform:scale(.9);
}

/* ================= HABILIDADES ================= */

#skills{
position:fixed;
left:50%;
bottom:17px;
transform:translateX(-50%);
z-index:40;
display:flex;
gap:5px;
max-width:calc(100% - 330px);
overflow:hidden;
}

.skill{
position:relative;
width:54px;
height:54px;
flex:none;
border:2px solid #967337;
border-radius:9px;
background:linear-gradient(#303640,#14171c);
box-shadow:0 3px 7px #000;
overflow:hidden;
}

.skill.locked{
filter:grayscale(1);
opacity:.45;
}

.skillIcon{
font-size:25px;
height:100%;
display:flex;
align-items:center;
justify-content:center;
}

.skillName{
position:absolute;
bottom:1px;
left:0;
right:0;
font-size:7px;
background:rgba(0,0,0,.7);
text-align:center;
white-space:nowrap;
overflow:hidden;
}

.skillLevel{
position:absolute;
top:1px;
right:3px;
font-size:9px;
color:#ffd65e;
}

.cooldown{
position:absolute;
left:0;
right:0;
top:0;
bottom:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.6);
font-weight:bold;
font-size:17px;
}

/* ================= MENSAJE ================= */

#message{
position:fixed;
left:50%;
top:28%;
transform:translateX(-50%);
z-index:100;
background:rgba(10,10,12,.9);
border:1px solid #c59a47;
border-radius:9px;
padding:10px 18px;
color:#ffe08a;
font-weight:bold;
font-size:14px;
text-align:center;
display:none;
box-shadow:0 4px 15px #000;
max-width:90%;
}

/* ================= PANELES ================= */

.panel{
position:fixed;
z-index:80;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(92vw,500px);
max-height:80vh;
overflow:auto;
background:linear-gradient(#272b32,#15171b);
border:2px solid #a37b35;
border-radius:13px;
box-shadow:0 8px 30px #000;
padding:14px;
display:none;
}

.panel.open{
display:block;
}

.panel h2{
margin:0 0 10px;
color:#ffd66a;
font-size:20px;
}

.closePanel{
float:right;
background:#501d1d;
border:1px solid #a44;
color:white;
border-radius:7px;
padding:4px 9px;
}

.statsGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px;
}

.stat{
background:#1c2026;
border:1px solid #464b54;
padding:8px;
border-radius:7px;
}

.inventoryGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.slot{
height:65px;
background:#181b20;
border:1px solid #62532f;
border-radius:7px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-size:24px;
position:relative;
}

.slotName{
font-size:8px;
text-align:center;
color:#ddd;
}

.slotQty{
position:absolute;
right:3px;
bottom:2px;
font-size:11px;
color:#ffd66a;
}

.itemButton{
width:100%;
padding:9px;
margin:4px 0;
background:linear-gradient(#3c414b,#1c2026);
border:1px solid #8b6b35;
border-radius:7px;
color:white;
text-align:left;
}

.itemButton:active{
transform:scale(.98);
}

.questItem{
padding:9px;
margin-bottom:6px;
background:#1b1f25;
border:1px solid #4c5058;
border-radius:8px;
}

.questItem.done{
border-color:#4f9d58;
}

.npcDialogue{
font-size:14px;
line-height:1.5;
margin-bottom:10px;
}

.actionRow{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.goldText{
color:#ffd34f;
}

.good{
color:#62e879;
}

.rare{
color:#5bbcff;
}

.epic{
color:#d978ff;
}

.legendary{
color:#ff9a32;
}

/* ================= DEATH ================= */

#deathScreen{
position:fixed;
inset:0;
z-index:200;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
text-align:center;
}

#deathScreen h1{
color:#d73737;
font-size:36px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

#miniWrap{
width:92px;
height:92px;
}

#questBox{
top:106px;
width:175px;
font-size:9px;
}

#sideButtons{
top:105px;
}

.uiButton{
width:40px;
height:40px;
font-size:17px;
}

#skills{
bottom:8px;
max-width:calc(100% - 260px);
}

.skill{
width:45px;
height:45px;
}

.skillIcon{
font-size:20px;
}

#joystick{
width:130px;
height:130px;
left:15px;
bottom:18px;
}

#joystickKnob{
width:60px;
height:60px;
margin-left:-30px;
margin-top:-30px;
}

#attackButton{
width:82px;
height:82px;
right:16px;
bottom:23px;
}

}

</style>

</head>

<body>

<canvas id="world"></canvas>

<div id="hud">

<div id="topPanel">

<div id="portrait"></div>

<div id="bars">

<div class="bar">
<div id="hpBar"></div>
<span class="barText" id="hpText"></span>
</div>

<div class="bar">
<div id="manaBar"></div>
<span class="barText" id="manaText"></span>
</div>

<div class="bar">
<div id="xpBar"></div>
<span class="barText" id="xpText"></span>
</div>

</div>

<div id="level">Nv. 1</div>

</div>

</div>

<div id="resources">

<div class="resource">💰 <span id="gold">0</span></div>
<div class="resource">🪵 <span id="wood">0</span></div>
<div class="resource">🪨 <span id="stone">0</span></div>
<div class="resource">🟠 <span id="copper">0</span></div>
<div class="resource">⚙️ <span id="iron">0</span></div>
<div class="resource">🐟 <span id="fish">0</span></div>

</div>

<div id="questBox">

<div id="questTitle">📜 Misión activa</div>

<div id="questText">
Habla con el Guardián de Ceniza.
</div>

</div>

<div id="miniWrap">

<canvas id="miniCanvas" width="180" height="180"></canvas>

</div>

<div id="sideButtons">

<button class="uiButton" id="inventoryButton">🎒</button>
<button class="uiButton" id="characterButton">⚔️</button>
<button class="uiButton" id="questsButton">📜</button>
<button class="uiButton" id="shopButton">🛒</button>

</div>

<div id="skills"></div>

<div id="joystick">

<div id="joystickKnob"></div>

</div>

<button id="attackButton">⚔️</button>

<div id="message"></div>

<!-- INVENTARIO -->

<div class="panel" id="inventoryPanel">

<button class="closePanel">X</button>

<h2>🎒 Inventario</h2>

<div id="inventoryContent"></div>

</div>

<!-- PERSONAJE -->

<div class="panel" id="characterPanel">

<button class="closePanel">X</button>

<h2>⚔️ Personaje</h2>

<div class="statsGrid">

<div class="stat">⭐ Nivel<br><b id="panelLevel">1</b></div>
<div class="stat">❤️ Vida<br><b id="panelHp">100</b></div>
<div class="stat">💙 Maná<br><b id="panelMana">50</b></div>
<div class="stat">⚔️ Daño<br><b id="panelDamage">25</b></div>
<div class="stat">🛡️ Defensa<br><b id="panelDefense">5</b></div>
<div class="stat">👟 Velocidad<br><b id="panelSpeed">260</b></div>

</div>

<h2 style="margin-top:15px">🧤 Equipamiento</h2>

<div id="equipmentContent"></div>

</div>

<!-- MISIONES -->

<div class="panel" id="questsPanel">

<button class="closePanel">X</button>

<h2>📜 Misiones</h2>

<div id="questsContent"></div>

</div>

<!-- TIENDA -->

<div class="panel" id="shopPanel">

<button class="closePanel">X</button>

<h2>🛒 Comerciante</h2>

<div id="shopContent"></div>

</div>

<!-- NPC -->

<div class="panel" id="npcPanel">

<button class="closePanel">X</button>

<h2 id="npcTitle">NPC</h2>

<div id="npcContent"></div>

</div>

<div id="deathScreen">

<div>

<h1>☠️ Has muerto</h1>

<p>Regresando a la ciudad...</p>

<p id="deathTimer"></p>

</div>

</div>

<script src="game.js?v=200"></script>

</body>

</html>
