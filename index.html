<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>⚔️ Reinos de Ceniza</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Arial,
                sans-serif;

            touch-action: none;
        }


        #world {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            display: block;

            z-index: 1;
        }


        #hud {

            position: fixed;

            top: 10px;
            left: 10px;

            z-index: 9998;

            color: white;

            background:
                rgba(0,0,0,0.65);

            padding: 9px 12px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;

            max-width: 190px;

            pointer-events: none;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.4);
        }


        #hud strong {

            color: #ffd84a;
        }


        #message {

            position: fixed;

            left: 50%;

            bottom: 8px;

            transform:
                translateX(-50%);

            z-index: 9998;

            color: white;

            background:
                rgba(0,0,0,0.65);

            padding: 7px 12px;

            border-radius: 10px;

            font-size: 12px;

            text-align: center;

            max-width: 65vw;

            pointer-events: none;
        }


        @media (
            min-width: 700px
        ) {

            #hud {

                font-size: 15px;

                max-width: 250px;
            }

            #message {

                font-size: 14px;
            }
        }

    </style>

</head>


<body>


    <canvas id="world"></canvas>


    <div id="hud">

        ⚔️
        <strong>REINOS DE CENIZA</strong>

        <br>

        Nivel:
        <span id="level">
            1
        </span>

        <br>

        ❤️ HP:
        <span id="hp">
            100/100
        </span>

        <br>

        💰 Oro:
        <span id="gold">
            0
        </span>

        <hr>

        🌲 Madera:
        <span id="wood">
            0
        </span>

        <br>

        🪨 Piedra:
        <span id="stone">
            0
        </span>

        <br>

        🟠 Cobre:
        <span id="copper">
            0
        </span>

        <br>

        ⚙️ Hierro:
        <span id="iron">
            0
        </span>

        <br>

        🎣 Peces:
        <span id="fish">
            0
        </span>

    </div>


    <div id="message">
        Cargando Reinos de Ceniza...
    </div>


    <script src="game.js?v=31"></script>

</body>

</html>
